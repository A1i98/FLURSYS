name: FLURSYS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: macos
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore release build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: flursys-release-${{ matrix.target }}
          cache-workspace-crates: "true"
          cache-on-failure: "true"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev
      - name: Build CLI and desktop workbench
        run: cargo build -p flursys --locked --release --bin flursys --bin flursys-gui --features gui
      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          stage="${RUNNER_TEMP}/flursys-package"
          mkdir -p "$stage"
          cp target/release/flursys target/release/flursys-gui "$stage/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p "$stage/share/applications" "$stage/share/icons/hicolor/512x512/apps" "$stage/share/icons/hicolor/scalable/apps"
            cp packaging/linux/flursys.desktop "$stage/share/applications/"
            cp ui/assets/flursys-icon.png "$stage/share/icons/hicolor/512x512/apps/flursys.png"
            cp ui/assets/flursys-logo.svg "$stage/share/icons/hicolor/scalable/apps/flursys.svg"
          else
            app="$stage/FLURSYS.app/Contents"
            mkdir -p "$app/MacOS" "$app/Resources" "${RUNNER_TEMP}/flursys.iconset"
            cp target/release/flursys-gui "$app/MacOS/"
            sed "s/@VERSION@/${GITHUB_REF_NAME#v}/g" packaging/macos/Info.plist > "$app/Info.plist"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" ui/assets/flursys-logo.png --out "${RUNNER_TEMP}/flursys.iconset/icon_${size}x${size}.png" >/dev/null
              double=$((size * 2))
              sips -z "$double" "$double" ui/assets/flursys-logo.png --out "${RUNNER_TEMP}/flursys.iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            iconutil -c icns "${RUNNER_TEMP}/flursys.iconset" -o "$app/Resources/flursys.icns"
          fi
          tar -C "$stage" -czf "dist/flursys-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" .
          sha256sum dist/* > "dist/flursys-${{ matrix.target }}-checksums.txt"
      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/flursys.exe,target/release/flursys-gui.exe -DestinationPath "dist/flursys-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Get-FileHash -Algorithm SHA256 dist/* | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path } | Set-Content "dist/flursys-${{ matrix.target }}-checksums.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: flursys-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: dist/*
