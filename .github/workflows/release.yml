name: FLURSYS release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build Windows installer only, or all platform packages
        type: choice
        options:
          - windows
          - all
        default: windows
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '[{"os":"windows-latest","target":"windows-x86_64","archive":"zip"}]' || '[{"os":"ubuntu-latest","target":"linux-x86_64","archive":"tar.gz"},{"os":"macos-latest","target":"macos","archive":"tar.gz"},{"os":"windows-latest","target":"windows-x86_64","archive":"zip"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore release build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: flursys-release-${{ matrix.target }}
          cache-workspace-crates: "true"
          cache-on-failure: "true"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev
      - name: Build CLI and desktop workbench
        run: cargo build -p flursys --locked --release --bin flursys --bin flursys-gui --bin flursys-compressible --features gui
      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          stage="${RUNNER_TEMP}/flursys-package"
          mkdir -p "$stage"
          cp target/release/flursys target/release/flursys-gui target/release/flursys-compressible "$stage/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p "$stage/share/applications" "$stage/share/icons/hicolor/512x512/apps" "$stage/share/icons/hicolor/scalable/apps"
            cp packaging/linux/flursys.desktop "$stage/share/applications/"
            cp ui/assets/flursys-icon.png "$stage/share/icons/hicolor/512x512/apps/flursys.png"
            cp ui/assets/flursys-logo.svg "$stage/share/icons/hicolor/scalable/apps/flursys.svg"
          else
            app="$stage/FLURSYS.app/Contents"
            mkdir -p "$app/MacOS" "$app/Resources" "${RUNNER_TEMP}/flursys.iconset"
            cp target/release/flursys-gui "$app/MacOS/"
            sed "s/@VERSION@/${GITHUB_REF_NAME#v}/g" packaging/macos/Info.plist > "$app/Info.plist"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" ui/assets/flursys-logo.png --out "${RUNNER_TEMP}/flursys.iconset/icon_${size}x${size}.png" >/dev/null
              double=$((size * 2))
              sips -z "$double" "$double" ui/assets/flursys-logo.png --out "${RUNNER_TEMP}/flursys.iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            iconutil -c icns "${RUNNER_TEMP}/flursys.iconset" -o "$app/Resources/flursys.icns"
          fi
          tar -C "$stage" -czf "dist/flursys-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" .
          sha256sum dist/* > "dist/flursys-${{ matrix.target }}-checksums.txt"
      - name: Cache verified Gmsh archives
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flursys-gmsh-cache
          key: windows-gmsh-${{ hashFiles('packaging/windows/gmsh.json') }}
      - name: Ensure Inno Setup is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe", "$env:ProgramFiles/Inno Setup 6/ISCC.exe")
          if (-not ($candidates | Where-Object { Test-Path $_ })) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup.' }
          }
      - name: Package Windows installer and portable bundle
        if: runner.os == 'Windows'
        id: windows-package
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - name: Smoke test Windows installation and bundled mesher
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLURSYS_INSTALLER: ${{ steps.windows-package.outputs.installer }}
        run: ./packaging/windows/smoke-test.ps1 -Installer $env:FLURSYS_INSTALLER
      - uses: actions/upload-artifact@v4
        with:
          name: flursys-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: dist/*
