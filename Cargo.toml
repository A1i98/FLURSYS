[package]
name = "flursys"
version = "0.10.0-beta.1"
edition = "2021"
authors = ["A1i98 and contributors"]
description = "Rust-native scientific simulation system"
license = "MIT"
repository = "https://github.com/A1i98/flursys"
keywords = [
  "cfd",
  "finite-volume",
  "navier-stokes",
  "pde",
  "rust",
  "scientific-computing",
]
categories = ["science", "simulation"]
default-run = "flursys-gui"

[lib]
name = "flursys"
path = "src/lib.rs"

[[bin]]
name = "flursys"
path = "src/bin/flursys.rs"

[[bin]]
name = "flursys-gui"
path = "src/bin/flursys_gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:rfd", "dep:slint", "dep:png", "dep:gif"]
gui-live-preview = ["gui", "slint/live-preview"]

# Slint and its rendering dependencies make full debug info and incremental
# compilation caches disproportionately large in local builds.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
# CAD workers contain third-party kernel panics and preserve the source document.
panic = "unwind"

[dependencies]
png = { version = "0.18", optional = true }
gif = { version = "0.14", optional = true }
rayon = "1"
rfd = { version = "0.17", optional = true }
slint = { version = "1.17", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
truck-modeling = "0.6"
truck-meshalgo = { version = "0.4", default-features = false, features = ["tessellation", "filters"] }
truck-shapeops = { version = "0.4", default-features = false }
truck-stepio = "0.3"

[build-dependencies]
slint-build = "1.17"
